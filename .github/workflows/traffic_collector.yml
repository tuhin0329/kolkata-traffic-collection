name: Kolkata Traffic 24/7 Automated Collector

on:
  schedule:
    - cron: '27 18 * * *'  # 12:00 AM IST (target: 18:30 UTC, fire slightly early)
    - cron: '27 4 * * *'   # 10:00 AM IST
    - cron: '27 7 * * *'   # 01:00 PM IST
    - cron: '27 13 * * *'  # 07:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Chrome Browser
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb
          npm install
          npx puppeteer browsers install chrome

      - name: Run Traffic Scraper
        run: |
          mkdir -p output
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node scraper.js run

      - name: Save & Push Excel Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "Auto-collected traffic data: $(date -u)" || exit 0
          git push origin main
