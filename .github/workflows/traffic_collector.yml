name: Kolkata Traffic 24/7 Automated Collector

on:
  schedule:
    # 4 Daily Slots in Indian Standard Time (IST):
    - cron: '30 18 * * *'  # 12:00 AM IST (18:30 UTC)
    - cron: '30 4 * * *'   # 10:00 AM IST (04:30 UTC)
    - cron: '30 7 * * *'   # 01:00 PM IST (07:30 UTC)
    - cron: '30 13 * * *'  # 07:00 PM IST (13:30 UTC)
  workflow_dispatch:        # Manual 1-click trigger from phone/web!

jobs:
  scrape:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install puppeteer exceljs

      - name: Run Traffic Scraper (Exact Laptop Replica)
        run: node scraper.js run

      - name: Save & Push Excel Files
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@traffic.local"
          git pull --rebase
          git add output/
          git commit -m "Auto-collected traffic data"
          git push
