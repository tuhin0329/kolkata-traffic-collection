name: Kolkata Traffic 24/7 Automated Collector

on:
  schedule:
    - cron: '30 18 * * *'  # 12:00 AM IST
    - cron: '30 4 * * *'   # 10:00 AM IST
    - cron: '30 7 * * *'   # 01:00 PM IST
    - cron: '30 13 * * *'  # 07:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      HEADLESS: "new"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install All Dependencies
        run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth node-cron exceljs

      - name: Install Virtual Display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: Run Traffic Scraper (Headless Cloud)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node scraper.js run

      - name: Save & Push Excel Files
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@traffic.local"
          git add -A
          git commit -m "Auto-collected traffic data: $(date -u)" || exit 0
          git pull --rebase origin main || true
          git push origin main
