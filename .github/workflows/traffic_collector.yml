name: Kolkata Traffic 24/7 Automated Collector

on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'Force specific slot (e.g. 10_00 AM, 01_00 PM, 07_00 PM, 12_00 AM)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Chrome Browser
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb
          npm install
          npx puppeteer browsers install chrome

      - name: Determine Target Slot
        id: slot
        run: |
          INPUT_SLOT="${{ github.event.inputs.slot }}"
          CRON="${{ github.event.schedule }}"
          EVENT="${{ github.event_name }}"
          echo "Event: $EVENT | Input Slot: $INPUT_SLOT | Cron: $CRON"

          if [ -n "$INPUT_SLOT" ]; then
            SLOT="$INPUT_SLOT"
          else
            # Triggered via API — auto-detect slot from current IST hour
            IST_HOUR=$(TZ="Asia/Kolkata" date +%H)
            echo "Current IST hour: $IST_HOUR"
            if [ "$IST_HOUR" -ge 9 ] && [ "$IST_HOUR" -le 11 ]; then
              SLOT="10_00 AM"
            elif [ "$IST_HOUR" -ge 12 ] && [ "$IST_HOUR" -le 14 ]; then
              SLOT="01_00 PM"
            elif [ "$IST_HOUR" -ge 18 ] && [ "$IST_HOUR" -le 20 ]; then
              SLOT="07_00 PM"
            else
              SLOT="12_00 AM"
            fi
          fi

          FORCED_DATE=$(TZ="Asia/Kolkata" date +%Y-%m-%d)
          echo "slot=$SLOT" >> $GITHUB_OUTPUT
          echo "date=$FORCED_DATE" >> $GITHUB_OUTPUT
          echo "✅ Target Slot: $SLOT | Date: $FORCED_DATE"

      - name: Run Traffic Scraper
        run: |
          mkdir -p output/excel output/logs output/screenshots
          SLOT="${{ steps.slot.outputs.slot }}"
          FDATE="${{ steps.slot.outputs.date }}"

          if [ -n "$SLOT" ]; then
            echo "🎯 FORCING slot=$SLOT date=$FDATE"
            xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
              node scraper.js --force-slot "$SLOT" --force-date "$FDATE"
          else
            echo "🔄 Auto-detecting slot"
            xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
              node scraper.js
          fi

      - name: Save & Push Excel Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "Auto-collected traffic data: $(TZ='Asia/Kolkata' date '+%Y-%m-%d %I:%M %p IST') [${{ steps.slot.outputs.slot }}]" || exit 0
          git push origin main

